services:
  cycling.rider.tracking.api:
    image: ${DOCKER_REGISTRY-}cyclingridertrackingapi
    build:
      context: .
      dockerfile: src/Cycling.Rider.Tracking.Api/Cycling.Rider.Tracking.Api/Dockerfile
    depends_on:
      postgres.tracking:
          condition: service_healthy
      rabbitmq:
          condition: service_healthy

  postgres.tracking:
    image: postgres:17
    container_name: postgres
    environment:
      - POSTGRES_DB=tracking
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/db:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.1
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ftinoco
      RABBITMQ_DEFAULT_PASS: ftinoco
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
          test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
          interval: 10s
          timeout: 5s
          retries: 5

  minio:
    image: minio/minio:latest
    container_name: tracking-minio
    ports:
      - "9000:9000"     # S3 API   -> http://localhost:9000
      - "9001:9001"     # Web UI   -> http://localhost:9001
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: fernandotinoco
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates the 'rides' bucket on first start, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: tracking-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin fernandotinoco &&
      mc mb --ignore-existing local/rides &&
      echo 'MinIO ready: bucket rides created.';
      "

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."  

volumes:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local
  postgres.tracking:
        name: tracking-database
  minio_data: